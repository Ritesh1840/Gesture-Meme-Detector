<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Gesture Meme Detector</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- layout: side-by-side on desktop/landscape, stacked on mobile/portrait ---- */
  .split {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  .pane {
    flex: 1 1 50%;
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  @media (max-width: 700px), (orientation: portrait) {
    .split {
      flex-direction: column;
    }
    .pane {
      flex: 1 1 50%;
    }
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
    background: #000;
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  #debugHud {
    position: absolute;
    top: 8px;
    left: 8px;
    color: #7cffa0;
    font: clamp(11px, 2.6vw, 14px)/1.4 monospace;
    white-space: pre;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
    z-index: 2;
    max-width: calc(100% - 16px);
  }

  /* ---- start / permission overlay ---- */
  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #startOverlay img {
    width: min(160px, 40vw);
    height: min(160px, 40vw);
    object-fit: contain;
    margin-bottom: 20px;
    border-radius: 16px;
  }
  #startOverlay h1 {
    font-size: clamp(18px, 5vw, 26px);
    margin: 0 0 8px;
  }
  #startOverlay p {
    font-size: clamp(13px, 3.5vw, 15px);
    color: #aaa;
    margin: 0 0 20px;
    max-width: 340px;
    line-height: 1.5;
  }
  #startBtn {
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #7cffa0;
    color: #003018;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #startBtn:active {
    transform: scale(0.97);
  }
  #startBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #startError {
    margin-top: 18px;
    color: #ff8080;
    font-size: 13px;
    max-width: 340px;
    line-height: 1.5;
    display: none;
  }
  #startOverlay.hidden {
    display: none;
  }
</style>
</head>
<body>
  <div class="split">
    <div class="pane">
      <video id="video" playsinline muted autoplay></video>
      <div id="debugHud"></div>
    </div>
    <div class="pane">
      <img id="memeImg" src="memes/pokercat.jpg" alt="" />
    </div>
  </div>

  <div id="startOverlay">
    <img src="memes/pokercat.jpg" alt="" />
    <h1>Meow Meow Cat Cam</h1>
    <p>Turn on your camera, then make a gesture or face to get a matching cat meme in real time.</p>
    <button id="startBtn">Enable camera</button>
    <div id="startError"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
